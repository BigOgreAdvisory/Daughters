<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8f7cf0">
<title>Ale &amp; Ana</title>
<link rel="icon" href="ale/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#f6e8ff,#dff1ff);color:#2d2a4a;
  font-family:"Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:24px 16px}
h1{margin:0;text-align:center;font-size:30px}
a.kid{display:flex;align-items:center;gap:18px;min-height:150px;padding:18px 22px;border-radius:36px;text-decoration:none;color:#fff;
  font-size:40px;font-weight:800;box-shadow:0 8px 0 rgba(0,0,0,.16);text-shadow:0 2px 0 rgba(0,0,0,.18)}
a.kid:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
a.kid .av{flex:0 0 110px;width:110px;height:110px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:66px;
  font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.ale{background:linear-gradient(135deg,#b07cff,#ff7fc8)}
.ana{background:linear-gradient(135deg,#5db2ff,#2ec2a0)}
.space{background:linear-gradient(135deg,#1F2A44,#0B1026)}
.space .av{background:#131A3D}
.quest{background:linear-gradient(135deg,#4c6fe0,#3ecf8e)}
.anaquest{background:linear-gradient(135deg,#e0559b,#ffb347)}
</style>
</head>
<body>
<main>
  <h1>Who is playing?</h1>
  <a class="kid ale" href="./ale/"><span class="av">🧚</span><span>Ale</span></a>
  <a class="kid ana" href="./ana/"><span class="av">🐳</span><span>Ana</span></a>
  <a class="kid space" href="./spacewords/"><span class="av">🛸</span><span>Space Words</span></a>
  <a class="kid quest" href="./dolch/"><span class="av">🦉</span><span>Ale's Word Quest</span></a>
  <a class="kid anaquest" href="./anawords/"><span class="av">🐳</span><span>Ana's Word Quest</span></a>
</main>
</body>
</html>
