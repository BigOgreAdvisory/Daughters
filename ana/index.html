<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4DA3FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ana's Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --blue:#4DA3FF; --orange:#FF9F43; --green:#2EC27E; --purple:#A66CFF; --yellow:#FFD23F;
  --ink:#23304a; --bg:#CDEBFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#bfe3fb;color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;max-width:600px;margin:0 auto;overflow:hidden;background:linear-gradient(#cdebff,#eaf7ff)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px max(env(safe-area-inset-bottom),10px);overflow:hidden}
.em{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;line-height:1}

/* ---------- shared bits ---------- */
.top{display:flex;align-items:center;justify-content:space-between;height:96px;flex:0 0 96px}
.ibtn{flex:0 0 96px;width:96px;height:96px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.ibtn .disc{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.13);display:grid;place-items:center;font-size:32px;transition:transform .1s}
.ibtn:active .disc{transform:scale(.9)}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:170px}
.dots i{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #9fc4ea}
.dots i.on{background:var(--yellow);border-color:#f2a900}
.big-btn{min-width:96px;min-height:96px;border:0;border-radius:30px;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.14);font-size:40px;font-weight:800;padding:0 28px;transition:transform .1s}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
#stage{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}

#caption{position:absolute;left:14px;right:14px;bottom:8px;z-index:30;background:rgba(35,48,74,.88);color:#fff;
  border-radius:14px;padding:7px 12px;font-size:16px;line-height:1.25;text-align:center;pointer-events:none}
#caption[hidden]{display:none}
#fx{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.spark{position:absolute;font-size:30px;animation:spark 1.1s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--rot))}}
#rotate{display:none;position:absolute;inset:0;z-index:60;background:#4DA3FF;color:#fff;align-items:center;justify-content:center;font-size:90px}
@media (orientation:landscape) and (max-height:520px){#rotate{display:flex}}

.wobble{animation:wobble .5s}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.hl{outline:6px solid #FFD23F;outline-offset:2px;animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}
.dim{opacity:.38;pointer-events:none;filter:saturate(.5)}
.glow{box-shadow:0 0 0 8px #FFD23F,0 0 30px 10px rgba(255,210,63,.8)!important;animation:pulse .6s ease-in-out infinite alternate}
.found{box-shadow:0 0 0 8px #2EC27E,0 6px 0 rgba(0,0,0,.14)!important;pointer-events:none}

/* ---------- home ---------- */
.home h1{margin:6px 0 0;text-align:center;font-size:27px;letter-spacing:.3px;color:#245a99;white-space:nowrap}
.home .hdr{display:flex;align-items:center;justify-content:space-between;height:96px;flex:0 0 96px}
.home .hdr .spacer{flex:0 0 96px;width:96px}
.home .hdr h1{flex:1}
.cards{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:center;padding:4px 0}
.card-game{border:0;border-radius:34px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  height:min(28vh,230px);min-height:150px;box-shadow:0 8px 0 rgba(0,0,0,.16);transition:transform .1s;font-weight:800;font-size:19px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.card-game:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
.card-game .ico{font-size:62px;white-space:nowrap;display:flex;gap:4px;align-items:center;justify-content:center;animation:bob 2.6s ease-in-out infinite}
.card-game:nth-child(2) .ico{animation-delay:-.7s}.card-game:nth-child(3) .ico{animation-delay:-1.3s}.card-game:nth-child(4) .ico{animation-delay:-2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.c-lake{background:linear-gradient(#5db2ff,#3b8fe6)}.c-sound{background:linear-gradient(#ffb566,#f58a1f)}
.c-sort{background:linear-gradient(#49d99d,#1fae74)}.c-word{background:linear-gradient(#b98bff,#8d55f0)}
.c-word .ico span{font-size:54px;font-weight:800;letter-spacing:2px}
.c-lake .ico span{font-size:58px;font-weight:800}
.bookbar{flex:0 0 auto;display:flex;justify-content:center;padding:4px 0 8px}
.bookbar .big-btn{display:flex;align-items:center;gap:12px;font-size:28px}

/* gear */
.gear{position:relative}
.gear svg.ring{position:absolute;inset:14px;width:68px;height:68px;transform:rotate(-90deg);pointer-events:none}
.gear svg.ring circle{fill:none;stroke:#3b8fe6;stroke-width:6;stroke-linecap:round;stroke-dasharray:201;stroke-dashoffset:201}
.gear .disc{width:52px;height:52px;font-size:24px;opacity:.75}

/* ---------- letter lake ---------- */
.lake{background:linear-gradient(#bfe8ff 0%,#8ccfff 55%,#5ab4f5 100%)}
.screen>.top,.screen>#stage{position:relative;z-index:1}
.lake .waves{z-index:0;position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(transparent,rgba(32,110,190,.3));pointer-events:none}
.floatzone{flex:1;display:grid;place-items:center;min-height:0}
.bubble{width:min(44vw,180px);height:min(44vw,180px);max-height:26vh;max-width:26vh;border-radius:50%;
  background:radial-gradient(circle at 30% 28%,#fff,#d9f1ff 70%);border:6px solid #fff;box-shadow:0 10px 0 rgba(30,90,160,.25);
  display:grid;place-items:center;font-weight:800;color:#2a4d8f;font-size:clamp(70px,13vh,120px);line-height:1;
  animation:rise 1.3s cubic-bezier(.2,.8,.3,1) both,bobl 3s 1.3s ease-in-out infinite}
.bubble.slab,.pad.slab{font-family:"Georgia","Noto Serif",serif}
@keyframes rise{from{transform:translateY(45vh) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes bobl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;padding:6px 0 10px;position:relative}
.choices>*{flex:0 0 calc(50% - 7px)}
.pad{min-height:96px;height:clamp(104px,16vh,142px);border:6px solid #38b872;border-radius:40px;background:#fff;box-shadow:0 8px 0 rgba(20,100,60,.3);
  font-size:clamp(56px,10vh,88px);font-weight:800;color:#1f5f3f;display:grid;place-items:center;padding:0;transition:transform .1s}
.pad:active{transform:translateY(5px)}

/* ---------- sound sort ---------- */
.sound{background:linear-gradient(#ffe9cc,#ffd29c)}
.wbar{display:flex;gap:6px;justify-content:center;margin:4px 0}
.wbar i{width:34px;height:20px;border-radius:8px;background:#fff;border:3px solid #e3a45c}
.wbar i.on{background:#ff8a1f;border-color:#c86a0b}
.pipsrow{display:flex;gap:8px;justify-content:center;font-size:32px;min-height:40px;align-items:center}
.pipsrow span{filter:grayscale(1);opacity:.4}.pipsrow span.on{filter:none;opacity:1}
.card{border:0;border-radius:32px;background:#fff;box-shadow:0 8px 0 rgba(0,0,0,.14);display:grid;place-items:center;padding:0;position:relative}
.card .em{font-size:clamp(56px,10vh,84px)}
.sound .tgtbox{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.sound .target{border:8px solid #ff8a1f;width:min(40vw,150px);height:min(40vw,150px);max-height:19vh;max-width:19vh}
.sound .grid{flex:1;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-content:center;padding-bottom:8px}
.sound .grid>.card{flex:0 0 calc(50% - 7px);height:clamp(104px,17vh,150px)}
.pair{flex:1;display:flex;gap:16px;justify-content:center;align-items:center;padding:6px 0}
.pair .card{width:min(42vw,175px);height:min(42vw,175px);max-height:24vh}
.sd{display:flex;gap:14px;padding:10px 0}
.sd .big-btn{flex:1;height:clamp(110px,17vh,150px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:44px;padding:0}
.sd .em{font-size:44px}

/* ---------- pattern sort shop ---------- */
.sort{background:linear-gradient(#d9ffe9,#aaf0cb)}
.sortstage{flex:1;display:flex;flex-direction:column;min-height:0}
.ruleicon{flex:0 0 44px;display:flex;justify-content:center;gap:8px;font-size:34px;align-items:center}
.itemzone{flex:1;display:grid;place-items:center;min-height:0}
.itemhome{position:relative;width:130px;height:130px;display:grid;place-items:center;touch-action:none;z-index:5;
  transition:transform .45s cubic-bezier(.3,.9,.3,1)}
.itemhome.drag{transition:none;z-index:9}
.itemhome .inner{display:grid;place-items:center;animation:pop .5s}
.bins{flex:0 0 auto;display:flex;gap:10px;justify-content:center;height:clamp(150px,25vh,215px);margin-bottom:8px}
.bin{flex:1 1 0;min-width:96px;max-width:190px;border:0;border-radius:26px 26px 18px 18px;background:#fff;box-shadow:0 8px 0 rgba(0,0,0,.14);
  border-top:10px solid #8aa1cc;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px 4px 6px;gap:4px;overflow:hidden}
.bin .stack{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:auto;min-height:34px}
.bin .stack svg{width:30px;height:30px}
.sw-in{animation:swap .7s}
@keyframes swap{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}

/* ---------- word match ---------- */
.word{background:linear-gradient(#efe4ff,#d9c4ff)}
.wordcard{align-self:center;background:#fff;border-radius:34px;box-shadow:0 8px 0 rgba(0,0,0,.14);padding:12px 36px;margin:6px 0 10px;
  font-size:clamp(64px,12vh,108px);font-weight:800;letter-spacing:6px;color:#4a2c8f;font-family:"Trebuchet MS","Century Gothic",Verdana,system-ui,sans-serif}
.wordcard b{font-weight:800;display:inline-block}
.wordcard b.hl{outline:none;color:#ff8a1f;animation:pulse .5s ease-in-out infinite alternate}
.word .grid{flex:1;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-content:center;padding-bottom:8px}
.word .grid>.card{flex:0 0 calc(50% - 7px);height:clamp(104px,17vh,150px)}

/* ---------- finish / stickers ---------- */
.finish{align-items:center;justify-content:center;gap:18px;text-align:center;background:linear-gradient(#fff3c4,#ffd8f0)}
.finish .big{font-size:min(30vw,130px);animation:pop 1s infinite}
.gifts{display:flex;gap:12px;justify-content:center}
.gift{width:min(29vw,126px);height:min(29vw,126px);min-width:96px;min-height:96px;border:0;border-radius:30px;background:#fff;box-shadow:0 8px 0 rgba(0,0,0,.15);
  font-size:min(16vw,72px);display:grid;place-items:center;animation:bob 1.6s ease-in-out infinite;padding:0}
.gift:nth-child(2){animation-delay:-.5s}.gift:nth-child(3){animation-delay:-1s}
.gift.open{animation:pop .7s}
.gift.gone{opacity:.35;animation:none}
.sticker-big{font-size:min(38vw,170px);animation:pop .9s}
.book{background:linear-gradient(#fff6d6,#ffe0f3)}
.sgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-content:start;padding:4px 2px 14px}
.scell{aspect-ratio:1;min-height:70px;border-radius:22px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.12);display:grid;place-items:center;font-size:44px;position:relative}
.scell.locked{background:#ffffffaa;box-shadow:none}.scell.locked .em{filter:grayscale(1) brightness(.5);opacity:.18}
.scell .n{position:absolute;right:4px;bottom:2px;font-size:14px;font-weight:700;background:#ffd23f;border-radius:10px;padding:0 6px}

/* ---------- parent settings ---------- */
.parent{background:#f4f7fb;overflow:auto;padding:14px 18px 24px;gap:14px;display:block}
.parent h2{margin:10px 0 4px;font-size:26px}
.parent h3{margin:20px 0 8px;font-size:18px;color:#46597e}
.seg{display:flex;gap:10px}
.seg button{flex:1;min-height:64px;border-radius:16px;border:3px solid #b8c6e0;background:#fff;font-size:20px;font-weight:700}
.seg button.on{background:#4DA3FF;border-color:#2f80d8;color:#fff}
.stat{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:16px}
.stat th,.stat td{padding:10px 8px;text-align:center;border-bottom:1px solid #e3e9f3}
.stat th{background:#e8eefa;font-size:14px}
.pbtn{min-height:64px;padding:0 22px;border-radius:16px;border:3px solid #b8c6e0;background:#fff;font-size:20px;font-weight:700}
.pbtn.danger{border-color:#d68f8f;color:#8a2c2c}
.row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.parent p{margin:6px 0;color:#46597e;font-size:15px;line-height:1.4}
</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <div id="caption" hidden></div>
  <div id="fx"></div>
  <div id="rotate"><span class="em">📱↻</span></div>
</div>

<script>
'use strict';
(function(){

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function wpick(items, wfn){
  const ws = items.map(wfn); let r = Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<items.length;i++){ r -= ws[i]; if(r<=0) return items[i]; }
  return items[items.length-1];
}
function html(str){ const t=document.createElement('template'); t.innerHTML=str.trim(); return t.content.firstChild; }
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* =====================================================================
   Storage (localStorage only)
   ===================================================================== */
const KEY = 'playlearn.ana.v1';
const OLD_KEY = 'playlearn.v1';   // used when this app lived at the site root; copied once, never deleted
const GAME_KEYS = ['lake','sound','sort','word'];
let S;
function defaults(){
  const g = {};
  GAME_KEYS.forEach(k => g[k] = {level:1, streak:0, misses:0, sessions:0, correct:0, attempts:0, items:{}});
  return {v:1, settings:{sound:true, rounds:10}, games:g, stickers:[], last:0};
}
function load(){
  let raw = null;
  try{
    if(localStorage.getItem(KEY) === null && localStorage.getItem(OLD_KEY) !== null) localStorage.setItem(KEY, localStorage.getItem(OLD_KEY));
  }catch(e){}
  try{ raw = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  const d = defaults();
  S = (raw && typeof raw==='object') ? raw : d;
  S.settings = Object.assign(d.settings, S.settings||{});
  S.games = S.games||{};
  GAME_KEYS.forEach(k => { S.games[k] = Object.assign(d.games[k], S.games[k]||{}); });
  S.stickers = Array.isArray(S.stickers) ? S.stickers : [];
}
function save(){ S.last = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* =====================================================================
   Speech (Web Speech API) with caption fallback
   ===================================================================== */
const TTS = {
  ok: ('speechSynthesis' in window) && (typeof SpeechSynthesisUtterance !== 'undefined'),
  voice: null, keep: [],
  init(){
    if(!this.ok) return;
    const pickVoice = () => {
      let vs = []; try{ vs = speechSynthesis.getVoices(); }catch(e){}
      if(!vs.length) return;
      const en = vs.filter(v => /^en[-_]US/i.test(v.lang));
      this.voice = en.find(v => /google us english|samantha|female/i.test(v.name)) || en[0] || vs.find(v => /^en/i.test(v.lang)) || null;
    };
    pickVoice();
    try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
  },
  live(){ return this.ok && S.settings.sound; },
  cancelAt: 0,
  cancel(){ this.cancelAt = Date.now(); if(this.ok){ try{ speechSynthesis.cancel(); }catch(e){} } },
  say(text, opt){
    opt = opt || {};
    if(!this.live()){ caption(text); return wait(Math.min(2200, 500 + text.length*50)); }
    return new Promise(res => {
      let done = false;
      const fin = () => { if(!done){ done = true; res(); } };
      const speakNow = () => {
        try{
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US'; if(this.voice) u.voice = this.voice;
          u.rate = opt.rate || 0.85; u.pitch = opt.pitch || 1.15; u.volume = 1;
          u.onend = fin; u.onerror = fin;
          this.keep.push(u); if(this.keep.length > 8) this.keep.shift();
          try{ speechSynthesis.resume(); }catch(e){}
          speechSynthesis.speak(u);
        }catch(e){ caption(text); fin(); }
      };
      // Android Chrome can drop a speak() issued right after cancel(); give it a moment
      const d = Math.max(0, 160 - (Date.now() - this.cancelAt));
      if(d > 0) setTimeout(speakNow, d); else speakNow();
      setTimeout(fin, 1700 + text.length*140);   // safety: some Android engines never fire onend
    });
  }
};
let capTimer = 0;
function caption(text){
  const c = $('#caption'); if(!c) return;
  c.textContent = text; c.hidden = false;
  clearTimeout(capTimer); capTimer = setTimeout(()=>{ c.hidden = true; }, 2600);
}

let SEQ = 0;   // spoken-sequence token: tapping or replaying stops an older sequence
function stopSeq(){ SEQ++; TTS.cancel(); document.querySelectorAll('.hl').forEach(x => x.classList.remove('hl')); }

/* =====================================================================
   Sound effects (Web Audio, no files)
   ===================================================================== */
let AC = null;
function ac(){
  if(!S.settings.sound) return null;
  try{
    if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(C) AC = new C(); }
    if(AC && AC.state === 'suspended') AC.resume();
  }catch(e){ AC = null; }
  return AC;
}
function tone(f, t0, dur, type, vol){
  const a = ac(); if(!a) return;
  try{
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    const t = a.currentTime + t0;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  }catch(e){}
}
const Sfx = {
  good(){ tone(523,0,.18,'triangle',.18); tone(659,.09,.18,'triangle',.18); tone(784,.18,.3,'triangle',.18); },
  soft(){ tone(330,0,.22,'sine',.12); tone(262,.12,.3,'sine',.1); },       // gentle "hmm", never harsh
  pop(){ tone(600,0,.09,'sine',.12); },
  win(){ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.12,.25,'triangle',.18)); },
  up(){ [660,880,1100].forEach((f,i)=>tone(f,i*.08,.2,'sine',.12)); }
};

/* =====================================================================
   Effects
   ===================================================================== */
function burst(cx, cy, n){
  const fx = $('#fx'); if(!fx) return;
  const set = ['⭐','✨','🎈','💫','🌟'];
  const box = fx.getBoundingClientRect();
  for(let i=0;i<(n||12);i++){
    const s = document.createElement('span');
    s.className = 'spark em'; s.textContent = pick(set);
    s.style.left = (cx - box.left) + 'px'; s.style.top = (cy - box.top) + 'px';
    const ang = Math.random()*Math.PI*2, d = 70 + Math.random()*110;
    s.style.setProperty('--dx', Math.cos(ang)*d + 'px');
    s.style.setProperty('--dy', Math.sin(ang)*d + 'px');
    s.style.setProperty('--rot', (Math.random()*240-120) + 'deg');
    fx.appendChild(s);
    setTimeout(()=>s.remove(), 1200);
  }
}
function burstAt(el, n){ if(!el) return; const r = el.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, n); }
function clearFx(){ const f = $('#fx'); if(f) f.innerHTML = ''; }

const PRAISE = ['Great job!','You got it!','Awesome!','Yes!','Super!','Nice one!','Wonderful!','Way to go!'];
const TRYAGAIN = ['Try again!','Let’s try once more!','Have another look!'];

/* =====================================================================
   Navigation
   ===================================================================== */
let SCR = 0;   // screen token: async work from a screen that was left must stop
function go(fn){
  SCR++; TTS.cancel(); clearTimeout(capTimer);
  const c = $('#caption'); if(c) c.hidden = true;
  clearFx();
  fn();
}
function setScreen(cls, inner){
  $('#screen').innerHTML = '<div class="screen ' + cls + '">' + inner + '</div>';
  return $('#screen .screen');
}

function holdGear(btn){
  const ring = btn.querySelector('.ring circle'); const C = 201;
  let active = false, t0 = 0, raf = 0;
  const reset = () => { active = false; cancelAnimationFrame(raf); ring.style.strokeDashoffset = C; };
  btn.addEventListener('pointerdown', e => {
    e.preventDefault(); active = true; t0 = performance.now();
    const tick = () => {
      if(!active) return;
      const p = Math.min(1, (performance.now()-t0)/3000);
      ring.style.strokeDashoffset = String(C*(1-p));
      if(p >= 1){ reset(); settings(); return; }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => btn.addEventListener(ev, reset));
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

/* =====================================================================
   Game framework: sessions, adaptive difficulty, finish screen
   ===================================================================== */
function startGame(key){
  go(()=>{
    const G = GAMES[key], g = S.games[key];
    const sess = {key, g, N:S.settings.rounds, round:0, ctx:{}, missCount:0, replay:null, tk:SCR};
    if(G.init) G.init(sess);
    const root = setScreen('game ' + key, `
      ${key==='lake'?'<div class="waves"></div>':''}
      <div class="top">
        <button class="ibtn" id="home" aria-label="Home"><span class="disc em">🏠</span></button>
        <div class="dots" id="dots"></div>
        <button class="ibtn" id="again" aria-label="Hear again"><span class="disc em">🔊</span></button>
      </div>
      <div id="stage"></div>`);
    $('#home').addEventListener('click', () => { Sfx.pop(); home(); });
    $('#again').addEventListener('click', () => { ac(); if(sess.replay) sess.replay(); });
    sess.done = (ok, itemKey) => completeRound(sess, ok, itemKey);
    nextRound(sess);
  });
}

function dots(sess){
  const d = $('#dots'); if(!d) return;
  let s = ''; for(let i=0;i<sess.N;i++) s += '<i class="' + (i<sess.round?'on':'') + '"></i>';
  d.innerHTML = s;
}

function nextRound(sess){
  if(sess.tk !== SCR) return;
  if(sess.round >= sess.N){ finishSession(sess); return; }
  dots(sess);
  const st = $('#stage'); st.innerHTML = '';
  sess.replay = null;
  GAMES[sess.key].round(sess, st, SCR);
}

function completeRound(sess, ok, itemKey){
  if(sess.tk !== SCR) return;
  const g = sess.g, G = GAMES[sess.key];
  g.attempts++; if(ok) g.correct++;
  if(itemKey){
    const it = g.items[itemKey] || (g.items[itemKey] = {c:0, n:0});
    it.n++; if(ok) it.c++;
  }
  if(ok){
    g.streak++; g.misses = 0;
    if(g.streak >= 5){ if(g.level < G.max){ g.level++; Sfx.up(); } g.streak = 0; }
  }else{
    g.misses++; g.streak = 0;
    if(g.misses >= 3){ if(g.level > 1) g.level--; g.misses = 0; }
  }
  save();
  sess.round++; dots(sess);
  const tk = SCR;
  setTimeout(() => { if(tk === SCR) nextRound(sess); }, 700);
}

async function finishSession(sess){
  sess.g.sessions++; save();
  go(async () => {
    const tk = SCR;
    const root = setScreen('finish', `
      <div class="big em">🎉</div>
      <div class="gifts" id="gifts" hidden>
        <button class="gift em" data-i="0">🎁</button><button class="gift em" data-i="1">🎁</button><button class="gift em" data-i="2">🎁</button>
      </div>
      <div id="after"></div>`);
    Sfx.win(); burst(innerWidth/2, innerHeight*0.3, 20);
    await TTS.say('All done! Great playing!');
    if(tk !== SCR) return;
    const gifts = $('#gifts'); gifts.hidden = false;
    TTS.say('Pick a present!');
    let picked = false;
    gifts.querySelectorAll('.gift').forEach(b => b.addEventListener('click', async () => {
      if(picked) return; picked = true; ac();
      const i = pickSticker(), st = STICKERS[i];
      b.classList.add('open'); b.textContent = st[0]; Sfx.good(); burstAt(b, 14);
      gifts.querySelectorAll('.gift').forEach(o => { if(o !== b) o.classList.add('gone'); });
      $('#after').innerHTML = '<button class="big-btn" id="gohome" aria-label="Home"><span class="em">🏠</span></button>';
      $('#gohome').addEventListener('click', home);
      await TTS.say('You got ' + st[1] + '!');
    }));
  });
}

   Letter names for speech
   ===================================================================== */
const LNAME = {a:'ay',b:'bee',c:'see',d:'dee',e:'ee',f:'eff',g:'jee',h:'aitch',i:'eye',j:'jay',k:'kay',l:'el',m:'em',
  n:'en',o:'oh',p:'pee',q:'cue',r:'ar',s:'ess',t:'tee',u:'you',v:'vee',w:'double you',x:'ex',y:'why',z:'zee'};
const lname = c => LNAME[c.toLowerCase()] || c;
const isSlab = c => c === 'I' || c === 'l';

/* =====================================================================
   GAME 1: Letter Lake
   ===================================================================== */
const LK_POOLS = [null,
  'aegrht'.split(''),
  'aegrhtfklmns'.split(''),
  'acefghijklmnorstuvwxyz'.split(''),
  'abcdefghijklmnopqrstuvwxyz'.split('')];
const LK_CHOICES = [0,2,3,4,4];
const LK_CONF = {b:'dpq',d:'bpq',p:'bdq',q:'bdp',m:'nw',n:'mh',u:'nv',v:'uw',w:'vm',i:'jl',l:'ij',g:'qy',j:'ig',h:'nb',y:'gv'};

GAMES.lake = {
  max: 4,
  init(sess){ sess.ctx.recent = []; },
  round(sess, st, tk){
    const g = sess.g, lvl = g.level, c = sess.ctx;
    const forward = sess.round < Math.ceil(sess.N/2);           // first half: little -> BIG, second half: BIG -> little
    const dir = forward ? 'L2U' : 'U2L';
    const pool = LK_POOLS[lvl];
    const wt = l => { const it = g.items[dir+':'+l]; return it && it.n ? 1 + 3*(1 - it.c/it.n) : 1.5; };
    const cands = pool.filter(l => !c.recent.includes(l));
    const t = wpick(cands.length ? cands : pool, wt);
    c.recent.push(t); if(c.recent.length > 3) c.recent.shift();

    // distractors
    const need = LK_CHOICES[lvl] - 1;
    let d = [];
    if(lvl >= 3 && LK_CONF[t] && Math.random() < 0.6){
      const cf = LK_CONF[t].split('').filter(x => pool.includes(x)); if(cf.length) d.push(pick(cf));
    }
    shuffle(pool.filter(x => x !== t && !d.includes(x))).forEach(x => { if(d.length < need) d.push(x); });
    const opts = shuffle([t].concat(d));

    const show = f => forward ? f.toLowerCase() : f.toUpperCase();      // what floats
    const cho  = f => forward ? f.toUpperCase() : f.toLowerCase();      // what is tapped
    const key = dir + ':' + t;

    st.innerHTML = `
      <div class="floatzone"><div class="bubble ${isSlab(show(t))?'slab':''}" id="fl">${esc(show(t))}</div></div>
      <div class="choices" id="ch">${opts.map(o => `<button class="pad ${isSlab(cho(o))?'slab':''}" data-l="${o}" data-ok="${o===t?1:0}">${esc(cho(o))}</button>`).join('')}</div>`;

    const intro = forward ? `This is little ${lname(t)}. Find the big ${lname(t)}.` : `This is big ${lname(t)}. Find the little ${lname(t)}.`;
    const short = forward ? `Find the big ${lname(t)}.` : `Find the little ${lname(t)}.`;
    sess.replay = () => { TTS.cancel(); TTS.say(short); };
    (async () => { await wait(700); if(tk===SCR) TTS.say(intro); })();

    let wrong = 0, busy = false;
    const pads = [...st.querySelectorAll('.pad')];
    pads.forEach(p => p.addEventListener('click', async () => {
      if(busy || tk !== SCR) return; ac();
      const ok = p.dataset.ok === '1';
      if(ok){
        busy = true; p.classList.add('found'); Sfx.good(); burstAt(p, 14); $('#fl').classList.add('pop');
        await TTS.say(pick(PRAISE) + ` Little ${lname(t)}, big ${lname(t)}.`);
        if(tk === SCR) sess.done(wrong === 0, key);
      }else{
        wrong++; p.classList.add('wobble','dim'); Sfx.soft();
        if(wrong >= 2){
          busy = true;
          const right = pads.find(x => x.dataset.ok === '1'); right.classList.add('glow');
          await TTS.say(`Here it is! Little ${lname(t)}, big ${lname(t)}.`);
          await wait(500);
          if(tk === SCR) sess.done(false, key);
        }else{
          TTS.say(`Hmm, that one is ${lname(p.dataset.l)}. Look for ${lname(t)}. ${pick(TRYAGAIN)}`);
        }
      }
    }));
  }
};

/* =====================================================================
   GAME 2: Sound Sort
   ===================================================================== */
// level: 1 same/different (first sound), 2-4 first sound (2/3/4 choices), 5 last sound, 6 middle sound
const SS = {
  1:{mode:'same'},
  2:{mode:'first', n:2, m:[1,1]},
  3:{mode:'first', n:3, m:[1,2]},
  4:{mode:'first', n:4, m:[1,3]},
  5:{mode:'last',  n:3, m:[1,1]},
  6:{mode:'mid',   n:3, m:[1,1]}
};
const SSKEY = {first:'f', last:'l', mid:'v'};

function ssPool(mode, lvl){
  if(mode==='same') return WORDS.filter(x => x.f && !x.b);
  if(mode==='first') return WORDS.filter(x => x.f && (lvl>=3 || !x.b));
  if(mode==='last') return WORDS.filter(x => x.l);
  return WORDS.filter(x => x.v);
}

function ssBuild(sess, lvl){
  const cfg = SS[lvl], g = sess.g;
  const pool = ssPool(cfg.mode, lvl);
  if(cfg.mode === 'same'){
    const same = Math.random() < 0.5;
    const groups = {}; pool.forEach(x => (groups[x.f] = groups[x.f] || []).push(x));
    let a, b;
    if(same){
      const gk = pick(Object.keys(groups).filter(k => groups[k].length >= 2));
      [a, b] = shuffle(groups[gk]).slice(0,2);
    }else{
      a = pick(pool); b = pick(pool.filter(x => x.f !== a.f));
    }
    return {mode:'same', a, b, same, key:`same:${a.w}|${b.w}`};
  }
  const k = SSKEY[cfg.mode];
  const m = cfg.m[0] + rnd(cfg.m[1]-cfg.m[0]+1);
  const wt = x => { const it = g.items[cfg.mode+':'+x.w]; return it && it.n ? 1 + 3*(1 - it.c/it.n) : 1.4; };
  let t = null, matches = [], tries = 0, mm = m;
  while(tries++ < 80){
    t = wpick(pool, wt);
    const cand = pool.filter(x => x !== t && x[k] === t[k]);
    if(cand.length >= mm){ matches = shuffle(cand).slice(0, mm); break; }
    if(tries > 60 && cand.length >= 1){ mm = 1; matches = shuffle(cand).slice(0,1); break; }
  }
  if(!matches.length){                       // safety net: any group with at least two words
    const grp = {}; pool.forEach(x => (grp[x[k]] = grp[x[k]] || []).push(x));
    const gk = pick(Object.keys(grp).filter(q => grp[q].length >= 2));
    const two = shuffle(grp[gk]).slice(0,2); t = two[0]; matches = [two[1]];
  }
  // distractors: different group each, if possible
  const used = new Set([t[k]]); const ds = [];
  for(const x of shuffle(pool)){
    if(ds.length >= cfg.n - matches.length) break;
    if(x === t || matches.includes(x) || used.has(x[k])) continue;
    ds.push(x); used.add(x[k]);
  }
  return {mode:cfg.mode, t, matches, opts:shuffle(matches.concat(ds)), key:`${cfg.mode}:${t.w}`};
}

function ssHintIntro(mode){ return mode==='first' ? 'Listen to the start.' : mode==='last' ? 'Listen to the end.' : 'Listen to the middle.'; }
function ssLikeWord(mode){ return mode==='first' ? 'starts like' : mode==='last' ? 'ends like' : 'has the same middle sound as'; }

GAMES.sound = {
  max: 6,
  init(sess){},
  round(sess, st, tk){
    const lvl = sess.g.level, r = ssBuild(sess, lvl);
    if(r.mode === 'same') return ssSame(sess, st, tk, r);

    const bar = r.mode==='first' ? [1,0,0] : r.mode==='last' ? [0,0,1] : [0,1,0];
    st.innerHTML = `
      <div class="tgtbox">
        <div class="wbar">${bar.map(x=>`<i class="${x?'on':''}"></i>`).join('')}</div>
        <button class="card target" id="tgt" data-w="${r.t.w}"><span class="em">${r.t.e}</span></button>
        <div class="pipsrow" id="pips">${r.matches.length>1?r.matches.map(()=>'<span class="em">⭐</span>').join(''):''}</div>
      </div>
      <div class="grid" id="grid">${r.opts.map(o => `<button class="card" data-w="${o.w}" data-ok="${r.matches.includes(o)?1:0}"><span class="em">${o.e}</span></button>`).join('')}</div>`;

    const tgt = $('#tgt'), cards = [...st.querySelectorAll('#grid .card')];
    const many = r.matches.length > 1;
    const promptText = many ? `Tap all the pictures that start like ${r.t.w}.`
      : r.mode==='first' ? `Which one starts like ${r.t.w}?`
      : r.mode==='last' ? `Which one ends like ${r.t.w}?`
      : `Which one has the same middle sound as ${r.t.w}?`;
    const sayIntro = async () => {
      if(tk!==SCR) return;
      stopSeq(); const sq = SEQ; await wait(200);
      const ok = () => tk===SCR && sq===SEQ;
      if(!ok()) return; await TTS.say(promptText);
      for(const el of [tgt].concat(cards)){
        if(!ok()) return;
        el.classList.add('hl'); await TTS.say(el.dataset.w, {rate:.8}); el.classList.remove('hl'); await wait(120);
      }
    };
    sess.replay = sayIntro;
    setTimeout(sayIntro, 500);
    tgt.addEventListener('click', () => { ac(); stopSeq(); TTS.say(r.t.w); });

    let wrong = 0, found = 0, busy = false;
    cards.forEach(c => c.addEventListener('click', async () => {
      if(busy || tk!==SCR) return; ac(); stopSeq();
      const w = c.dataset.w, isMatch = c.dataset.ok === '1';
      if(isMatch){
        found++; c.classList.add('found'); Sfx.good(); burstAt(c, 10);
        const pips = [...st.querySelectorAll('#pips span')]; if(pips[found-1]) pips[found-1].classList.add('on');
        if(found === r.matches.length){
          busy = true;
          await TTS.say(`${pick(PRAISE)} ${w}, ${r.t.w}.`);
          if(tk===SCR) sess.done(wrong===0, r.key);
        }else{
          TTS.say(w + '. Yes! Find another one.');
        }
      }else{
        wrong++; c.classList.add('wobble','dim'); Sfx.soft();
        if(wrong >= 2){
          busy = true;
          const left = cards.filter(x => x.dataset.ok==='1' && !x.classList.contains('found')); left.forEach(x => x.classList.add('glow'));
          await TTS.say(`Let’s see. ${left.map(x=>x.dataset.w).join(' and ')} and ${r.t.w} go together.`);
          await wait(500);
          if(tk===SCR) sess.done(false, r.key);
        }else{
          await TTS.say(`${ssHintIntro(r.mode)} ${r.t.w}. ${w}. Not quite. ${pick(TRYAGAIN)}`);
        }
      }
    }));
  }
};

function ssSame(sess, st, tk, r){
  st.innerHTML = `
    <div class="tgtbox"><div class="wbar"><i class="on"></i><i></i><i></i></div></div>
    <div class="pair">
      <button class="card" id="pa" data-w="${r.a.w}"><span class="em">${r.a.e}</span></button>
      <button class="card" id="pb" data-w="${r.b.w}"><span class="em">${r.b.e}</span></button>
    </div>
    <div class="sd">
      <button class="big-btn" id="same" data-ok="${r.same?1:0}" aria-label="same"><span style="display:flex;gap:6px">${shapeSVG('circle',COLORS.blue,44)}${shapeSVG('circle',COLORS.blue,44)}</span></button>
      <button class="big-btn" id="diff" data-ok="${r.same?0:1}" aria-label="different"><span style="display:flex;gap:6px">${shapeSVG('circle',COLORS.blue,44)}${shapeSVG('circle',COLORS.yellow,44)}</span></button>
    </div>`;
  const pa = $('#pa'), pb = $('#pb');
  const sayIntro = async () => {
    if(tk!==SCR) return;
    stopSeq(); const sq = SEQ; await wait(200);
    const ok = () => tk===SCR && sq===SEQ;
    if(!ok()) return; pa.classList.add('hl'); await TTS.say(r.a.w, {rate:.8}); pa.classList.remove('hl'); await wait(250);
    if(!ok()) return; pb.classList.add('hl'); await TTS.say(r.b.w, {rate:.8}); pb.classList.remove('hl'); await wait(200);
    if(!ok()) return; await TTS.say('Do they start the same? Or different?');
  };
  sess.replay = sayIntro; setTimeout(sayIntro, 500);
  pa.addEventListener('click', () => { ac(); stopSeq(); TTS.say(r.a.w); });
  pb.addEventListener('click', () => { ac(); stopSeq(); TTS.say(r.b.w); });

  let wrong = 0, busy = false;
  [$('#same'), $('#diff')].forEach(b => b.addEventListener('click', async () => {
    if(busy || tk!==SCR) return; ac(); stopSeq();
    const ok = b.dataset.ok === '1';
    if(ok){
      busy = true; b.classList.add('found'); Sfx.good(); burstAt(b, 12);
      await TTS.say(`${pick(PRAISE)} ${r.a.w}, ${r.b.w}. ${r.same ? 'They start the same.' : 'They start different.'}`);
      if(tk===SCR) sess.done(wrong===0, r.key);
    }else{
      wrong++; b.classList.add('wobble','dim'); Sfx.soft();
      if(wrong >= 2){
        busy = true; const right = ok ? b : (b.id==='same' ? $('#diff') : $('#same')); right.classList.add('glow');
        await TTS.say(`${r.a.w}, ${r.b.w}. ${r.same ? 'They start the same.' : 'They start different.'}`);
        await wait(500); if(tk===SCR) sess.done(false, r.key);
      }else{
        await TTS.say(`Listen to the start. ${r.a.w}. ${r.b.w}. ${pick(TRYAGAIN)}`);
      }
    }
  }));
}

/* =====================================================================
   GAME 3: Sorting Shop
   ===================================================================== */
const COLORS = {blue:'#3D8BFD', yellow:'#FFC933', red:'#F2545B', green:'#2EC27E'};
const GRAY = '#6b7a99';
function shapeSVG(shape, fill, px, strokeDark){
  const stroke = strokeDark || 'rgba(0,0,0,.28)';
  let body;
  if(shape==='circle') body = '<circle cx="50" cy="50" r="42"/>';
  else if(shape==='square') body = '<rect x="10" y="10" width="80" height="80" rx="12"/>';
  else if(shape==='triangle') body = '<polygon points="50,8 94,88 6,88" stroke-linejoin="round"/>';
  else body = '<polygon points="50,6 61,38 95,38 67,58 78,92 50,71 22,92 33,58 5,38 39,38" stroke-linejoin="round"/>';
  return `<svg viewBox="0 0 100 100" width="${px}" height="${px}" fill="${fill}" stroke="${stroke}" stroke-width="4">${body}</svg>`;
}
const SHAPES = ['circle','square','triangle','star'];

function sortRule(sess){
  const c = sess.ctx, lvl = sess.g.level;
  if(lvl === 1) return 'color';
  if(lvl === 2) return c.r2;
  if(lvl === 3) return c.r3;
  if(lvl === 4) return c.r4;
  return ['color','shape'][(c.r5 + Math.floor(sess.round/3)) % 2];
}

GAMES.sort = {
  max: 5,
  init(sess){
    const c = sess.ctx;
    c.col2 = pick([['blue','yellow'],['blue','red'],['yellow','red'],['yellow','green'],['blue','green']]);
    c.col3 = ['blue','yellow', pick(['red','green'])];
    c.shp2 = shuffle(SHAPES).slice(0,2);
    c.shp3 = shuffle(SHAPES).slice(0,3);
    c.r2 = pick(['size','shape']); c.r3 = pick(['color','shape']); c.r4 = pick(['color','shape']); c.r5 = rnd(2);
    c.sig = '';
  },
  round(sess, st, tk){
    const c = sess.ctx, lvl = sess.g.level, rule = sortRule(sess);
    // bins for this rule/level
    let bins;
    if(rule==='color') bins = (lvl===1 ? c.col2 : c.col3);
    else if(rule==='shape') bins = (lvl===2 ? c.shp2 : c.shp3);
    else bins = ['big','small'];
    const sig = rule + ':' + bins.join(',');
    const changed = sig !== c.sig; const firstEver = c.sig === '';
    const ruleChanged = !firstEver && rule !== c.lastRule;
    c.sig = sig; c.lastRule = rule;

    // item attributes: the sorted attribute comes from bins, the others vary only at levels 4-5
    const item = {color:'yellow', shape:'circle', size:'big'};
    if(rule==='shape') item.shape = pick(bins); else if(rule==='size') item.size = pick(bins); else item.color = pick(bins);
    if(lvl <= 3){
      if(rule==='shape') item.color = 'blue';
      if(rule==='size'){ item.color = 'yellow'; item.shape = 'circle'; }
      if(rule==='color') item.shape = 'circle';
    }else{
      if(rule==='color') item.shape = pick(c.shp3);
      if(rule==='shape') item.color = pick(c.col3);
    }
    const answer = item[rule];

    const binHTML = bins.map(v => {
      let sample;
      if(rule==='color') sample = shapeSVG('circle', COLORS[v], 64);
      else if(rule==='shape') sample = shapeSVG(v, GRAY, 64);
      else sample = shapeSVG('circle', GRAY, v==='big'?70:36);
      return `<button class="bin ${changed&&!firstEver?'sw-in':''}" data-v="${v}" data-ok="${v===answer?1:0}">${sample}<div class="stack"></div></button>`;
    }).join('');
    const ruleIcon = rule==='color' ? '🌈' : rule==='shape' ? '🔷' : '↔️';
    const px = item.size==='small' ? 62 : 112;
    st.innerHTML = `
      <div class="sortstage">
        <div class="ruleicon em" id="ri">${ruleIcon}</div>
        <div class="itemzone"><div class="itemhome" id="item"><div class="inner">${shapeSVG(item.shape, COLORS[item.color], px)}</div></div></div>
        <div class="bins" id="bins">${binHTML}</div>
      </div>`;

    const desc = (item.size==='small'?'small ':'') + item.color + ' ' + item.shape;
    const ruleSay = rule==='color' ? 'Sort by color!' : rule==='shape' ? 'Sort by shape!' : 'Sort big and small!';
    const intro = firstEver ? ruleSay : ruleChanged ? 'Switch! ' + ruleSay : changed ? ruleSay : 'Where does it go?';
    sess.replay = () => { TTS.cancel(); TTS.say(ruleSay); };
    setTimeout(() => { if(tk===SCR) TTS.say(intro); }, 500);

    const binEls = [...st.querySelectorAll('.bin')];
    const itemEl = $('#item');
    let wrong = 0, busy = false;

    const hint = () => {
      if(rule==='color') return `This one is ${item.color}. Find the ${item.color} one.`;
      if(rule==='shape') return `This is a ${item.shape}. Find the ${item.shape}.`;
      return `This one is ${item.size}. Find the ${item.size} one.`;
    };
    let tx = 0, ty = 0;   // current drag offset of the item
    const flyTo = (binEl) => {
      const a = itemEl.getBoundingClientRect(), b = binEl.getBoundingClientRect();
      const baseX = a.left + a.width/2 - tx, baseY = a.top + a.height/2 - ty;   // item centre with no transform
      const dx = (b.left + b.width/2) - baseX, dy = (b.top + 70) - baseY;
      tx = dx; ty = dy;
      itemEl.style.transform = `translate(${dx}px,${dy}px) scale(.45)`;
    };
    const finishPlace = async (binEl, ok) => {
      flyTo(binEl); await wait(480);
      if(tk!==SCR) return;
      const mini = document.createElement('span'); mini.innerHTML = shapeSVG(item.shape, COLORS[item.color], 30);
      binEl.querySelector('.stack').appendChild(mini.firstChild);
      itemEl.style.visibility = 'hidden';
    };
    const attempt = async (binEl) => {
      if(busy || tk!==SCR) return; ac();
      if(binEl.dataset.v === answer){
        busy = true; Sfx.good(); burstAt(binEl, 12);
        await finishPlace(binEl, true);
        await TTS.say(`${pick(PRAISE)} ${answer==='big'||answer==='small' ? 'The '+answer+' ones go together.' : answer + ' goes with ' + answer + '.'}`);
        if(tk===SCR) sess.done(wrong===0, 'rule:'+rule);
      }else{
        wrong++; binEl.classList.add('wobble'); Sfx.soft(); itemEl.style.transform = ''; tx = 0; ty = 0;
        setTimeout(()=>binEl.classList.remove('wobble'), 520);
        if(wrong >= 2){
          busy = true;
          const right = binEls.find(b => b.dataset.v === answer); right.classList.add('glow');
          await finishPlace(right, false);
          await TTS.say(`It goes here. ${hint().split('.')[0]}.`);
          await wait(400);
          if(tk===SCR) sess.done(false, 'rule:'+rule);
        }else{
          TTS.say(`Hmm. ${hint()} ${pick(TRYAGAIN)}`);
        }
      }
    };
    binEls.forEach(b => b.addEventListener('click', () => attempt(b)));

    // drag support
    let id = null, sx = 0, sy = 0, moved = false, dragging = false;
    itemEl.addEventListener('pointerdown', e => {
      if(busy) return; ac(); id = e.pointerId; try{ itemEl.setPointerCapture(id); }catch(_){}
      sx = e.clientX; sy = e.clientY; moved = false; dragging = true; itemEl.classList.add('drag');
    });
    itemEl.addEventListener('pointermove', e => {
      if(!dragging || e.pointerId !== id) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if(Math.abs(dx)+Math.abs(dy) > 10) moved = true;
      tx = dx; ty = dy;
      itemEl.style.transform = `translate(${dx}px,${dy}px) scale(1.08)`;
    });
    const end = e => {
      if(!dragging) return; dragging = false; itemEl.classList.remove('drag');
      if(!moved){ itemEl.style.transform = ''; tx = 0; ty = 0; TTS.say(desc); return; }
      const r = itemEl.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
      const hit = binEls.find(b => { const q = b.getBoundingClientRect(); return cx>=q.left && cx<=q.right && cy>=q.top && cy<=q.bottom; });
      if(hit) attempt(hit); else { itemEl.style.transform = ''; tx = 0; ty = 0; }
    };
    itemEl.addEventListener('pointerup', end);
    itemEl.addEventListener('pointercancel', () => { dragging = false; itemEl.classList.remove('drag'); itemEl.style.transform = ''; tx = 0; ty = 0; });
  }
};

/* =====================================================================
   GAME 4: Word Match (simple 3-letter words -> picture)
   ===================================================================== */
const READ = WORDS.filter(x => x.v && x.w.length === 3 && x.w !== 'fox');
const READ_EASY = ['cat','dog','sun','pig','bus','bed','hat','cup'].map(w => WBY[w]);
const CONFLICT = [['hat','cap'],['pot','pan']];
const WM_N = [0,2,3,4,4];
const conflicts = (a, b) => CONFLICT.some(p => (p[0]===a.w && p[1]===b.w) || (p[1]===a.w && p[0]===b.w));

GAMES.word = {
  max: 4,
  init(sess){ sess.ctx.recent = []; },
  round(sess, st, tk){
    const g = sess.g, lvl = g.level, c = sess.ctx;
    const pool = lvl === 1 ? READ_EASY : READ;
    const wt = x => { const it = g.items[x.w]; return (it && it.n ? 1 + 3*(1 - it.c/it.n) : 1.4) * (c.recent.includes(x.w) ? .05 : 1); };
    const t = wpick(pool, wt);
    c.recent.push(t.w); if(c.recent.length > 4) c.recent.shift();

    const n = WM_N[lvl] - 1;
    const base = pool.filter(x => x !== t && !conflicts(x, t) && x.e !== t.e);
    let ds = [];
    const add = list => shuffle(list).forEach(x => { if(ds.length < n && !ds.includes(x) && !ds.some(y => conflicts(x,y))) ds.push(x); });
    if(lvl === 4){
      add(base.filter(x => x.w[0] === t.w[0] || x.w[2] === t.w[2]));
      add(base.filter(x => x.w[0] !== t.w[0] && x.w[1] === t.w[1]));
    }else if(lvl === 3){
      add(base.filter(x => x.v === t.v && x.w[0] !== t.w[0]));
    }
    add(base.filter(x => x.w[0] !== t.w[0] && x.v !== t.v));
    add(base);
    const opts = shuffle([t].concat(ds));

    st.innerHTML = `
      <div class="wordcard" id="wc">${t.w.split('').map(ch => `<b>${ch}</b>`).join('')}</div>
      <div class="grid" id="grid">${opts.map(o => `<button class="card" data-w="${o.w}" data-ok="${o===t?1:0}"><span class="em">${o.e}</span></button>`).join('')}</div>`;

    const cards = [...st.querySelectorAll('.card')], letters = [...st.querySelectorAll('#wc b')];
    const prompt = 'Read the word. Tap the picture that matches.';
    sess.replay = () => { TTS.cancel(); TTS.say(prompt); };
    setTimeout(() => { if(tk===SCR) TTS.say(sess.round===0 ? prompt : 'Which picture matches?'); }, 500);

    let wrong = 0, busy = false;
    cards.forEach(cd => cd.addEventListener('click', async () => {
      if(busy || tk!==SCR) return; ac();
      if(cd.dataset.ok === '1'){
        busy = true; cd.classList.add('found'); Sfx.good(); burstAt(cd, 12); $('#wc').classList.add('pop');
        await TTS.say(`${pick(PRAISE)} ${t.w}!`);
        if(tk===SCR) sess.done(wrong===0, t.w);
      }else{
        wrong++; cd.classList.add('wobble','dim'); Sfx.soft();
        if(wrong >= 2){
          busy = true;
          cards.find(x => x.dataset.ok==='1').classList.add('glow');
          for(const l of letters){ l.classList.add('hl'); await wait(380); if(tk!==SCR) return; l.classList.remove('hl'); }
          await TTS.say(`This word says ${t.w}.`, {rate:.7});
          await wait(400);
          if(tk===SCR) sess.done(false, t.w);
        }else{
          letters[0].classList.add('hl');
          TTS.say(`That is a ${cd.dataset.w}. Look at the first letter. It is ${lname(t.w[0])}. ${pick(TRYAGAIN)}`);
        }
      }
    }));
  }
};

load(); TTS.init();
window.addEventListener('pagehide', save);
document.addEventListener('contextmenu', e => e.preventDefault());
home();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
