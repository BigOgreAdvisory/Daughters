<button class="backbtn" id="backBtn" aria-label="Back"><b>&#8592;</b>Back</button>
<div class="top backroom"><h1>Math games</h1></div>
<div class="games three">
  <button class="game c2" data-go="math-game.html?g=count" data-stars="math:count:best">
    <img src="emoji/1f31f.svg" alt="">
    <span class="t">Star Count</span>
    <span class="d">Count, compare, tens and ones</span>
    <span class="got"></span>
  </button>
  <button class="game c1 alt" data-go="math-game.html?g=ops" data-stars="math:ops:best">

    <span class="d">Add, subtract, times, and divide</span>
    <span class="got"></span>
  </button>
  <button class="game c3" data-go="math-game.html?g=pattern" data-stars="math:pattern:best">
    <img src="emoji/1f47d.svg" alt="">
    <span class="t">Alien Patterns</span>
    <span class="d">What comes next? Crack the code</span>
    <span class="got"></span>
  </button>
